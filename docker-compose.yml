# Local demo: Lodestone + PostgreSQL + OpenLDAP with test users.
#   docker compose up --build
#   open http://localhost:8000  — log in as alice / alice-password (admin) or bob / bob-password
#   e-mails land in Mailpit: http://localhost:8025
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lodestone
      POSTGRES_USER: lodestone
      POSTGRES_PASSWORD: lodestone
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lodestone"]
      interval: 5s
      retries: 10

  ldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ldap-admin-password
    volumes:
      - ./deploy/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro

  mail:                                         # catches all e-mail for the demo
    image: axllent/mailpit:v1.21.8
    ports: ["8025:8025"]

  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
      ldap: {condition: service_started}
      mail: {condition: service_started}
    ports: ["8000:8000"]
    environment:
      LODESTONE_DATABASE_URL: postgresql+psycopg://lodestone:lodestone@db:5432/lodestone
      LODESTONE_SECRET_KEY: demo-only-change-me-in-production
      LODESTONE_COOKIE_SECURE: "false"          # plain http on localhost
      LODESTONE_ADMIN_USERNAME: admin           # break-glass local account
      LODESTONE_ADMIN_PASSWORD: admin-password-1
      LODESTONE_LDAP_ENABLED: "true"
      LODESTONE_LDAP_URL: ldap://ldap:389
      LODESTONE_LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LODESTONE_LDAP_BIND_PASSWORD: ldap-admin-password
      LODESTONE_LDAP_USER_BASE: ou=people,dc=example,dc=org
      LODESTONE_LDAP_USER_FILTER: (uid={username})
      LODESTONE_LDAP_ALLOWED_GROUP: cn=lodestone-users,ou=groups,dc=example,dc=org
      LODESTONE_LDAP_ADMIN_GROUP: cn=lodestone-admins,ou=groups,dc=example,dc=org
      LODESTONE_SMTP_HOST: mail
      LODESTONE_SMTP_PORT: "1025"
      LODESTONE_SMTP_SECURITY: none
      LODESTONE_SMTP_FROM: Lodestone <lodestone@example.org>
    restart: unless-stopped

volumes:
  pgdata:
