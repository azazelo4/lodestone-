{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lodestone.fullname" . }}
  labels: {{- include "lodestone.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ required "secretKey is required (or set existingSecret)" .Values.secretKey | quote }}
  database-url: {{ required "databaseUrl is required (or set existingSecret)" .Values.databaseUrl | quote }}
  ldap-bind-password: {{ .Values.auth.ldap.bindPassword | quote }}
  admin-password: {{ .Values.admin.password | quote }}
{{- end }}
